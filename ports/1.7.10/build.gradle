plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

version = '1.7.10-1.5.1'
group = 'com.rptubes'

base {
    archivesName = 'rptubes'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.7.10'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '12'
    username = 'Developer'
}

repositories {
    maven { url = 'https://maven.covers1624.net/' }
}

dependencies {
    compileOnly('codechicken:ForgeMultipart:1.7.10-1.2.0.347:dev') { transitive = false }
    compileOnly('codechicken:CodeChickenLib:1.7.10-1.1.3.141:dev') { transitive = false }
}

// cofh/api/energy holds compile-only RF API stubs; the real API ships with RF mods
jar {
    exclude 'cofh/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}
