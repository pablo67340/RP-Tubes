modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Eloraam (RedPower 2), SpaceToad & the BuildCraft team (Automatic Crafting Table), immibis (Tubestuff ACT Mk II), MrTJP & the ProjectRed team"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Soft deps — we consume their tin / red alloy via forge tags, we do not duplicate them.
[[dependencies.${mod_id}]]
modId="projectred_core"
mandatory=false
versionRange="[4.18,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="projectred_exploration"
mandatory=false
versionRange="[4.18,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="projecte"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[11.6.0,)"
ordering="NONE"
side="CLIENT"
